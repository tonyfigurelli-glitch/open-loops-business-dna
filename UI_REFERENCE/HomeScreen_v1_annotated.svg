<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1536" viewBox="0 0 1500 1536">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f1140" flood-opacity="0.25"/>
    </filter>
    <style>
      .callout-box { fill: rgba(255,255,255,0.94); stroke: #7c3aed; stroke-width: 2; filter: url(#shadow); }
      .callout-title { fill: #12094f; font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .callout-body { fill: #2d2854; font-family: Inter, Arial, sans-serif; font-size: 18px; }
      .number { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      .marker { fill: #6d28d9; stroke: #ffffff; stroke-width: 5; filter: url(#shadow); }
      .line { stroke: #6d28d9; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 8; }
    </style>
  </defs>

  <image href="HomeScreen_v1.png" x="0" y="0" width="1024" height="1536"/>

  <rect x="1048" y="42" width="410" height="145" rx="24" class="callout-box"/>
  <text x="1076" y="84" class="callout-title">1. Lumi Bubble</text>
  <text x="1076" y="121" class="callout-body">Not human. Not alien.</text>
  <text x="1076" y="151" class="callout-body">Listening, curiosity, thought.</text>
  <line x1="1048" y1="114" x2="815" y2="118" class="line"/>
  <circle cx="780" cy="118" r="24" class="marker"/>
  <text x="780" y="118" class="number">1</text>

  <rect x="1048" y="215" width="410" height="145" rx="24" class="callout-box"/>
  <text x="1076" y="257" class="callout-title">2. Talk to Lumi</text>
  <text x="1076" y="294" class="callout-body">Primary CTA.</text>
  <text x="1076" y="324" class="callout-body">Always most prominent.</text>
  <line x1="1048" y1="288" x2="150" y2="225" class="line"/>
  <circle cx="118" cy="222" r="24" class="marker"/>
  <text x="118" y="222" class="number">2</text>

  <rect x="1048" y="410" width="410" height="180" rx="24" class="callout-box"/>
  <text x="1076" y="452" class="callout-title">3. Bubble Workspace</text>
  <text x="1076" y="489" class="callout-body">Organic thought clusters.</text>
  <text x="1076" y="519" class="callout-body">No folders. No file tree.</text>
  <text x="1076" y="549" class="callout-body">Thinking, not storage.</text>
  <line x1="1048" y1="500" x2="595" y2="638" class="line"/>
  <circle cx="555" cy="650" r="24" class="marker"/>
  <text x="555" y="650" class="number">3</text>

  <rect x="1048" y="790" width="410" height="170" rx="24" class="callout-box"/>
  <text x="1076" y="832" class="callout-title">4. Insight Card</text>
  <text x="1076" y="869" class="callout-body">AI observations.</text>
  <text x="1076" y="899" class="callout-body">Never prescriptive.</text>
  <text x="1076" y="929" class="callout-body">Always curiosity-based.</text>
  <line x1="1048" y1="878" x2="760" y2="1094" class="line"/>
  <circle cx="724" cy="1122" r="24" class="marker"/>
  <text x="724" y="1122" class="number">4</text>

  <rect x="1048" y="1230" width="410" height="178" rx="24" class="callout-box"/>
  <text x="1076" y="1272" class="callout-title">5. Navigation</text>
  <text x="1076" y="1309" class="callout-body">Home, Loops, Lumi,</text>
  <text x="1076" y="1339" class="callout-body">Universe, Me.</text>
  <text x="1076" y="1369" class="callout-body">Simple mental model.</text>
  <line x1="1048" y1="1318" x2="650" y2="1434" class="line"/>
  <circle cx="620" cy="1442" r="24" class="marker"/>
  <text x="620" y="1442" class="number">5</text>
</svg>
